[project]
name = "qns"
version = "0.1.0"
description = "Q's Note Speak - Blazie BNS emulator"
requires-python = ">=3.11"
dependencies = [
    "z180",
    "numpy>=1.26.0",
    "sounddevice>=0.4.6",
    "click>=8.0.0",
    # Register-level SSI-263 engine for --audio chip.  Wheels exist only for
    # these platforms; the backend reports a clear error elsewhere.
    "ssi263speech==0.9.1; (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64'))",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qns"]

[tool.uv.sources]
ssi263speech = [
    { url = "https://github.com/tgeczy/ssi263-speech/releases/download/v0.9.1/ssi263speech-0.9.1-py3-none-win_amd64.whl", marker = "sys_platform == 'win32'" },
    { url = "https://github.com/tgeczy/ssi263-speech/releases/download/v0.9.1/ssi263speech-0.9.1-py3-none-linux_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { url = "https://github.com/tgeczy/ssi263-speech/releases/download/v0.9.1/ssi263speech-0.9.1-py3-none-linux_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
z180 = { git = "https://github.com/ctoth/z-core", rev = "f144ef8bb7c91a648c5a0a96a79dfb6b286941f9", subdirectory = "crates/z180-py" }

[tool.pytest.ini_options]
addopts = '-m "not manual"'
markers = [
    "manual: marks tests as requiring manual verification (deselect with '-m \"not manual\"')",
]
timeout = 300

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "hypothesis>=6.156.9",
    "pytest>=9.0.2",
    "pytest-timeout>=2.4.0",
    "ruff>=0.1.0",
]
